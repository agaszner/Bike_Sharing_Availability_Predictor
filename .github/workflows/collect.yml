name: collect

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Does the data branch exist?
        id: data
        run: |
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.data.outputs.exists == 'true'
        with:
          ref: data
          path: data

      - name: Start an empty orphan data branch (first run)
        if: steps.data.outputs.exists != 'true'
        run: |
          git init data
          cd data
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git switch --orphan data

      - name: Collect snapshot
        run: python3 collector/collect.py data

      - name: Commit and push
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin HEAD:data || (git pull --rebase origin data && git push origin HEAD:data)
